name: Inspect embedded audio lyrics (read-only)
on:
  push:
    branches:
      - diagnostics/ogg-lyrics-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install metadata reader
        run: python -m pip install mutagen
      - name: Report audio tags without printing lyric content
        shell: python
        run: |
          from pathlib import Path
          import json, re
          from mutagen import File
          result = []
          for path in sorted(Path('.').iterdir()):
              if path.suffix.lower() not in ('.mp3', '.ogg', '.flac', '.m4a', '.opus', '.wav'):
                  continue
              row = {'file': path.name}
              try:
                  obj = File(path)
                  row['detected_type'] = type(obj).__name__ if obj else None
                  tags = obj.tags if obj else None
                  keys = list(tags.keys()) if tags else []
                  row['tag_keys'] = [str(k) for k in keys]
                  lyrics = []
                  for key in keys:
                      if re.search(r'lyric|unsync|sync|^text|^lrc|^sylt|^uslt', str(key), re.I):
                          v = tags[key]
                          vals = v if isinstance(v, list) else [v]
                          for item in vals:
                              s = str(getattr(item, 'text', item))
                              lyrics.append({'key': str(key), 'chars': len(s), 'has_lrc_timestamps': bool(re.search(r'\\[\\d{1,2}:\\d{2}', s))})
                  row['lyric_fields'] = lyrics
              except Exception as e:
                  row['error'] = str(e)[:200]
              result.append(row)
          print('LYRICS_METADATA_REPORT_BEGIN')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print('LYRICS_METADATA_REPORT_END')
